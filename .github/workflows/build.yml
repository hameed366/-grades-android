name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tool: math, name: "درجات الرياضيات", id: com.hameed.grades.math }
          - { tool: science, name: "درجات العلوم", id: com.hameed.grades.science }
          - { tool: english, name: "درجات اللغة الإنجليزية", id: com.hameed.grades.english }
          - { tool: arabic, name: "درجات اللغة العربية", id: com.hameed.grades.arabic }
          - { tool: any-subject, name: "درجات المواد", id: com.hameed.grades.any }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare files
        run: |
          mkdir -p app/src/main/java/com/hameed/grades app/src/main/assets/www app/src/main/res/mipmap-xxxhdpi
          cp MainActivity.java app/src/main/java/com/hameed/grades/
          cp AndroidManifest.xml app/src/main/
          cp app-build.gradle app/build.gradle
          cp "${{ matrix.tool }}.html" app/src/main/assets/www/index.html
          cp "icon-${{ matrix.tool }}.png" app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Build APK
        env:
          LC_ALL: C.UTF-8
          JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
        run: gradle assembleRelease --no-daemon -PappId=${{ matrix.id }} "-PappName=${{ matrix.name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tool }}-apk
          path: app/build/outputs/apk/release/*.apk
